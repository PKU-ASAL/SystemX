agent:
  id: node-a
  host_id: node-a
  tenant_id: default
  token: dev-token
  scenario: "" # optional test/development label for manager scenario queries

manager:
  address: http://10.66.0.10:9443
  transport: stream

control:
  socket_path: /var/run/sysarmor/agent.sock

sensor:
  backend: tetragon
  mode: managed
  version: "v1.x"
  bundle_dir: /opt/sysarmor/bundles/tetragon
  install_dir: /opt/sysarmor/sensors
  tetra_path: /opt/sysarmor/sensors/tetragon/current/bin/tetra
  tetragon_path: /opt/sysarmor/sensors/tetragon/current/bin/tetragon
  policy_path: /etc/sysarmor/policies/sysarmor-tetragon.yaml
  event_source: "" # managed mode runs tetra getevents; set "-" only for stdin JSONL debugging
  scope:
    type: host # host | container | cgroup | namespace | pod
    selector: "" # required for non-host scopes, e.g. container id prefix
  observe_only: true
  restart: always
  max_restarts: 5
  max_parse_errors: 10
  max_dropped_events: 0
  restart_window: 60s

spool:
  path: /var/lib/sysarmor/agent/spool
  max_bytes: 268435456
  batch_size: 256
  flush_interval: 1s

upload:
  retry_initial: 1s
  retry_max: 30s
  request_timeout: 10s

health:
  interval: 10s

policy:
  refresh_interval: 30s

content:
  path: /var/lib/sysarmor/agent/content
  trust_keys: "" # comma-separated key_id=base64_ed25519_public_key

resource:
  max_active_cep_groups: 4096
  max_event_refs_per_signal: 128
