agent:
  state_path: /var/lib/sysarmor/agent
  label.env: dev # optional metadata; tests can add label.workload or label.scenario

control:
  socket_path: /run/sysarmor/agent.sock

runtime:
  feature_flags:
    matcher_strategy: linear # linear | optimized; SYSARMOR_TEST_MATCHER_STRATEGY can override in tests

sensor:
  backend: tetragon
  mode: managed
  version: "v1.x"
  bundle_dir: /opt/sysarmor/agent/bundles/tetragon
  install_dir: /opt/sysarmor/agent/sensors
  tetra_path: /opt/sysarmor/agent/sensors/tetragon/current/bin/tetra
  tetragon_path: /opt/sysarmor/agent/sensors/tetragon/current/bin/tetragon
  policy_path: /etc/sysarmor/policies/sysarmor-tetragon.yaml
  event_source: "" # managed mode runs tetra getevents; set "-" only for stdin JSONL debugging
  scope:
    type: host # host | container | cgroup | namespace | pod
    selector: "" # required for non-host scopes; use namespace/self when the agent runs inside the target container
  observe_only: true
  restart: always
  max_restarts: 5
  max_parse_errors: 10
  max_dropped_events: 0
  restart_window: 60s

telemetry:
  batch_size: 256
  flush_interval: 1s

data_plane:
  retry_initial: 1s
  retry_max: 30s
  request_timeout: 10s

health:
  interval: 10s

policy:
  refresh_interval: 30s

content:
  trust_keys: "" # comma-separated key_id=base64_ed25519_public_key

resource:
  max_active_cep_groups: 4096
  max_event_refs_per_signal: 128

storage:
  max_bytes: 10GiB
  min_free_bytes: 2GiB
  event_segment_size: 64MiB
  signal_max_count: 100000
