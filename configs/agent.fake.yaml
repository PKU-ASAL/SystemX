agent:
  id: node-a
  host_id: node-a
  tenant_id: default
  token: dev-token

manager:
  address: http://127.0.0.1:9443
  transport: grpc
  tls_ca: ""
  tls_cert: ""
  tls_key: ""
  tls_server_name: ""
  tls_insecure: false

control:
  socket_path: /tmp/sysarmor-agent.sock

sensor:
  backend: fake
  mode: managed
  policy_path: test/policies/collection.yaml
  observe_only: true
  restart: always

telemetry:
  max_batch_items: 256
  max_batch_bytes: 256KiB
  flush_interval: 1s

health:
  interval: 10s

content:
  trust_keys: ""

resource:
  max_active_cep_groups: 4096
  max_event_refs_per_signal: 128

policy:
  path: /etc/sysarmor/agent/policy.json
