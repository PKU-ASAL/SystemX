agent:
  id: node-a
  host_id: node-a
  tenant_id: default
  token: dev-token

manager:
  address: http://127.0.0.1:9443
  transport: grpc
  tls_ca: ""
  tls_cert: ""
  tls_key: ""
  tls_server_name: ""
  tls_insecure: false

control:
  socket_path: /tmp/sysarmor-agent.sock

sensor:
  backend: fake
  mode: managed
  policy_path: test/policies/collection.yaml
  observe_only: true
  restart: always

spool:
  path: /tmp/sysarmor-agent-spool
  max_bytes: 268435456
  batch_size: 256
  flush_interval: 1s

data_plane:
  retry_initial: 1s
  retry_max: 30s
  request_timeout: 10s

health:
  interval: 10s

content:
  path: /tmp/sysarmor-agent-content
  trust_keys: ""

resource:
  max_active_cep_groups: 4096
  max_event_refs_per_signal: 128
