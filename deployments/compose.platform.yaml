services:
  postgres:
    build: ./postgres
    container_name: sysarmor-postgres
    environment:
      POSTGRES_DB: sysarmor
      POSTGRES_USER: sysarmor
      POSTGRES_PASSWORD: sysarmor
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysarmor -d sysarmor"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    build: ./kafka
    container_name: sysarmor-kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "19092:9092"

  redis:
    build: ./redis
    container_name: sysarmor-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  opensearch:
    build: ./opensearch
    container_name: sysarmor-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  manager:
    build:
      context: ..
      dockerfile: deployments/manager/Dockerfile
    container_name: sysarmor-manager
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_REDIS_ADDR: redis:6379
    ports:
      - "19443:9443"
      - "19444:9444"

  worker:
    build:
      context: ..
      dockerfile: deployments/worker/Dockerfile
    container_name: sysarmor-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_KAFKA_TOPIC: sysarmor.agent.upload.raw
      SYSARMOR_KAFKA_GROUP_ID: sysarmor-ingest-worker
      SYSARMOR_OPENSEARCH_URL: http://opensearch:9200

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
