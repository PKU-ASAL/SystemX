name: apt-fileless-c2
kind: malicious
window: workload
labels:
  events:
    - id: payload_download
      required: false
      behavior: network.connect
      match:
        socket: "10.66.0.99:8080"
        process: "*curl*"
    - id: payload_write
      required: false
      behavior: file.write
      match:
        path: "/dev/shm/x.sh"
    - id: payload_chmod
      required: false
      behavior: file.chmod
      match:
        path: "/dev/shm/x.sh"
    - id: payload_exec
      required: false
      behavior: process.exec
      match:
        process: "/dev/shm/x.sh"
    - id: reverse_c2
      required: true
      behavior: network.connect
      match:
        socket: "10.66.0.99:443"
  signals:
    - id: download_by_lolbin
      required: false
      name: download_by_lolbin
      entities:
        - "socket:10.66.0.99:8080"
      link_events:
        - payload_download
    - id: payload_dropped
      required: false
      name: payload_dropped
      entities:
        - "file:/dev/shm/x.sh"
      link_events:
        - payload_write
    - id: payload_lifecycle
      required: false
      name: payload_lifecycle
      entities:
        - "file:/dev/shm/x.sh"
        - "socket:10.66.0.99:443"
      link_events:
        - payload_write
        - payload_exec
        - reverse_c2
    - id: reverse_shell_pattern
      required: true
      name: reverse_shell_pattern
      terminal: true
      entities:
        - "socket:10.66.0.99:443"
      link_events:
        - reverse_c2
