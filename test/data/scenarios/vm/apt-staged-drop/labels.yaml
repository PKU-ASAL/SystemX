name: apt-staged-drop
kind: malicious
window: workload
objectives:
  alert:
    required_events:
      - helper_c2
    required_signals:
      - reverse_shell_pattern
  evidence:
    required_events:
      - helper_download
      - helper_write
      - helper_exec
      - helper_c2
    required_signals:
      - download_by_lolbin
      - payload_dropped
      - suspicious_exec_connect
      - payload_lifecycle
labels:
  events:
    - id: helper_download
      behavior: network.connect
      match:
        socket: "10.66.0.99:8080"
        process: "*curl*"
    - id: helper_write
      behavior: file.write
      match:
        path: "/var/lib/app/plugins/helper"
    - id: helper_chmod
      behavior: file.chmod
      match:
        path: "/var/lib/app/plugins/helper"
    - id: helper_exec
      behavior: process.exec
      match:
        process: "/var/lib/app/plugins/helper"
    - id: helper_c2
      behavior: network.connect
      match:
        socket: "10.66.0.99:443"
  signals:
    - id: download_by_lolbin
      name: download_by_lolbin
      entities:
        - "socket:10.66.0.99:8080"
      link_events:
        - helper_download
    - id: payload_dropped
      name: payload_dropped
      terminal: false
      entities:
        - "file:/var/lib/app/plugins/helper"
      link_events:
        - helper_write
    - id: suspicious_exec_connect
      name: suspicious_exec_connect
      terminal: false
      entities:
        - "file:/var/lib/app/plugins/helper"
        - "socket:10.66.0.99:443"
      link_events:
        - helper_exec
        - helper_c2
    - id: payload_lifecycle
      name: payload_lifecycle
      terminal: false
      entities:
        - "file:/var/lib/app/plugins/helper"
        - "socket:10.66.0.99:443"
      link_events:
        - helper_exec
        - helper_c2
    - id: reverse_shell_pattern
      name: reverse_shell_pattern
      terminal: true
      entities:
        - "socket:10.66.0.99:443"
      link_events:
        - helper_c2
policy:
  terminal_signals_allowed: 1
