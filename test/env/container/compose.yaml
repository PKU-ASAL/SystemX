# 拓扑 A：容器拓扑（3 节点 + tetragon 传感器）
# 用法: cd test/env/container && docker compose up -d
# 清理: docker compose down -v
#
# attacker  10.66.0.99  C2 (http :8080 + nc :443)
# node-a    10.66.0.11  受害端点（web 运行时 + CI 构建 + 假凭据）
# mgr       10.66.0.10  manager / agent data-control endpoint
# worker    10.66.0.13  Kafka ingest consumer + detection/indexing
# postgres 10.66.0.20  control/state/audit store
# kafka    10.66.0.21  telemetry ingest log
# redis    10.66.0.22  hot state
# opensearch 10.66.0.23 evidence/search layer
# tetragon  10.66.0.12  eBPF 传感器 + sysarmor-agent stream smoke
#
# tetragon 通过 eBPF 在内核层采集，同时加入 sysarmor-net 以便 agent smoke 上传 manager。

services:
  attacker:
    build: ./images/attacker
    container_name: attacker
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.99

  node-a:
    build: ./images/node-a
    container_name: node-a
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.11
    volumes:
      - app-plugins:/var/lib/app/plugins
      - node-secrets:/var/run/secrets/kubernetes.io/serviceaccount

  mgr:
    build: ./images/mgr
    container_name: mgr
    depends_on:
      - postgres
      - kafka
      - redis
      - opensearch
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.10
    ports:
      - "19443:9443"
      - "19444:9444"
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_REDIS_ADDR: redis:6379
    volumes:
      - ../../../bin:/opt/sysarmor/bin:ro

  worker:
    build: ./images/mgr
    container_name: worker
    depends_on:
      - postgres
      - kafka
      - opensearch
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.13
    environment:
      SYSARMOR_POSTGRES_DSN: postgres://sysarmor:sysarmor@postgres:5432/sysarmor?sslmode=disable
      SYSARMOR_KAFKA_BROKERS: kafka:9092
      SYSARMOR_KAFKA_TOPIC: sysarmor.agent.upload.raw
      SYSARMOR_KAFKA_GROUP_ID: sysarmor-ingest-worker
      SYSARMOR_OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ../../../bin:/opt/sysarmor/bin:ro
    entrypoint:
      - bash
      - -lc
      - /opt/sysarmor/bin/sysarmor-worker --store-backend postgres --postgres-driver $${SYSARMOR_POSTGRES_DRIVER:-postgres} --postgres-dsn "$$SYSARMOR_POSTGRES_DSN"

  postgres:
    image: postgres:16-alpine
    container_name: sysarmor-postgres
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.20
    environment:
      POSTGRES_DB: sysarmor
      POSTGRES_USER: sysarmor
      POSTGRES_PASSWORD: sysarmor
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: sysarmor-kafka
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.21
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "19092:9092"

  redis:
    image: redis:7-alpine
    container_name: sysarmor-redis
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.22
    ports:
      - "16379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: sysarmor-opensearch
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.23
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  tetragon:
    image: quay.io/cilium/tetragon:v1.7.0
    container_name: tetragon
    pid: host
    privileged: true
    cgroup: host
    networks:
      sysarmor-net:
        ipv4_address: 10.66.0.12
    volumes:
      - /sys/kernel/btf/vmlinux:/var/lib/tetragon/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - ../../../bin:/opt/sysarmor/bin:ro

networks:
  sysarmor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.66.0.0/24

volumes:
  app-plugins:
  node-secrets:
  postgres-data:
  opensearch-data:
