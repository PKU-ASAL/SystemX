syntax = "proto3";

package sysarmor.incident.v1;

option go_package = "github.com/sysarmor/sysarmor-next-project/api/proto/incident/v1;incidentv1";

import "api/proto/signal/v1/signal.proto";

message GraphNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  repeated sysarmor.signal.v1.EntityRef entities = 4;
}

message GraphEdge {
  string id = 1;
  string from = 2;
  string to = 3;
  string kind = 4;
}

message EvidenceSubgraph {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message ConvergeTrace {
  string method = 1;
  repeated string seed_ids = 2;
  repeated string path_ids = 3;
  float score = 4;
  repeated string controls = 5;
}

message Incident {
  string id = 1;
  reserved 2;
  reserved "scenario";
  string summary = 3;
  uint32 severity = 4;
  repeated string mitre = 5;
  repeated string lineage_ids = 6;
  repeated string terminals = 7;
  EvidenceSubgraph evidence = 8;
  ConvergeTrace converge = 9;
  repeated sysarmor.signal.v1.Signal contributing_signals = 10;
  string status = 11 [deprecated = true];
  string status_reason = 12 [deprecated = true];
  string status_actor = 13 [deprecated = true];
  map<string, string> labels = 14;
  string tenant_id = 15;
  string correlation_key = 16;
  string analysis_version = 17;
  string first_observed_at = 18;
  string last_observed_at = 19;
}
