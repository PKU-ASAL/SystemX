syntax = "proto3";

package sysarmor.analytics.v1;

option go_package = "github.com/sysarmor/sysarmor-next-project/api/proto/analytics/v1;analyticsv1";

import "api/proto/event/v1/event.proto";
import "api/proto/signal/v1/signal.proto";

message AgentHello {
  string agent_id = 1;
  string host_id = 2;
  string version = 3;
}

message UploadBatch {
  AgentHello agent = 1;
  repeated sysarmor.event.v1.CanonicalEvent events = 2;
  repeated sysarmor.signal.v1.Signal signals = 3;
}

message UploadAck {
  bool ok = 1;
  string message = 2;
  uint64 accepted_events = 3;
  uint64 accepted_signals = 4;
}

service Link1 {
  rpc Upload(UploadBatch) returns (UploadAck);
}
